[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hx"
dynamic = ["version"]
description = "Function-scoped structure extractor: call graph + types + structs from an entry point, viewable and annotatable in a browser."
requires-python = ">=3.10"
dependencies = [
    "libclang>=16",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "tomli>=2; python_version < '3.11'",
    "mcp>=2,<3",
    "pyright[nodejs]>=1.1.414,<2",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]                               # compatibility extra; included in the base install
dev = ["pytest>=7", "httpx>=0.25", "jsonschema>=4", "coverage>=7.4"]
e2e = ["playwright>=1.40"]                         # optional browser workflow tests
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocstrings[python]>=0.30,<1",
    "mkdocstrings-python>=1.18,<2",
    "pymdown-extensions>=10.15,<11",  # compatible highlighter API for mkdocstrings 0.x
    "black>=25,<26",  # format long API signatures in the documentation
]

[project.scripts]
hx = "hx.cli:main"

[tool.setuptools.dynamic]
version = {attr = "hx.__version__"}

[tool.setuptools.packages.find]
include = ["hx", "hx.*"]

[tool.setuptools.package-data]
hx = ["viewer/*.html", "viewer/*.js", "viewer/*.css", "viewer/vendor/*", "architecture/*.html", "architecture/*.js", "schema/*.json", "netlist/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
