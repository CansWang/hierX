[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hx"
version = "0.1.0"
description = "Function-scoped structure extractor: call graph + types + structs from an entry point, viewable and annotatable in a browser."
requires-python = ">=3.10"
dependencies = [
    "libclang>=16",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hx = "hx.cli:main"

[tool.setuptools.packages.find]
include = ["hx", "hx.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
