name: ci
# Required toolchains are installed and HX_REQUIRE_TOOLS=1 makes their skips fail.
# Vendor checks remain opt-in through HX_REQUIRE_VENDOR_TOOLS.
on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: documentation dependencies
        run: python -m pip install -e ".[dev,docs]"
      - name: strict documentation build
        run: mkdocs build --strict
      - name: interface coverage and simulator-free tutorials
        run: python -m pytest -q tests/test_docs.py tests/test_tutorials.py -k "not toolchain and not oracle"
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: dev/d2_bridge/go.sum
      - name: pinned upstream D2 bridge (explicit optional-tool setup)
        run: |
          bash dev/scripts/setup_d2_bridge.sh
          cd dev/d2_bridge
          go test ./...
      - name: toolchains (verilator, clang, ngspice, rust-analyzer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator clang gcc ngspice
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rust-analyzer rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/hx-ci"
          echo "$RUNNER_TEMP/hx-ci/bin" >> "$GITHUB_PATH"
      - name: clean base install (runtime dependencies must be sufficient)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check
          hx --help
          hx mcp --help
          hx serve --help
          hx migrate --help
          python -c "import hx.project, hx.mcp_server, hx.diff, hx.graphio, hx.values"
          pyright --version
      - name: installed-wheel smoke test outside the checkout (netlist, Xyce, Rust and D2 architecture)
        run: PYTHON=python dev/scripts/wheel_smoke.sh "$RUNNER_TEMP/hx-wheel-smoke"
      - name: developer dependencies (+ Playwright and its Chromium for the browser tests)
        run: |
          python -m pip install ".[dev,e2e]"
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: tests (skips are failures)
        env:
          HX_REQUIRE_TOOLS: "1"
        run: |
          rust-analyzer --version
          ngspice --version
          python -m pytest -q -ra
      - name: node unit tests for the viewer
        run: node --test tests/js
